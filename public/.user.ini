; Configuration PHP pour FastCGI/PHP-FPM
; Ce fichier est utilisé quand mod_php n'est pas disponible

; Limites d'upload
upload_max_filesize = 20M
post_max_size = 20M

; Limites de temps
max_execution_time = 300
max_input_time = 300

; Mémoire
memory_limit = 256M

; Affichage des erreurs (à désactiver en production)
display_errors = Off
log_errors = On
error_log = ../logs/error.log

; Timezone
date.timezone = Europe/Paris

; Sessions
session.gc_maxlifetime = 86400
session.cookie_httponly = 1
session.use_only_cookies = 1
